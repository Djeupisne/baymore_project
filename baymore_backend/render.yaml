# Blueprint Render — permet de tout créer en un clic depuis
# https://dashboard.render.com/blueprints (New > Blueprint > pointez ce repo).
databases:
  - name: baymore-db
    plan: free
    databaseName: baymore
    user: baymore

services:
  - type: web
    name: baymore-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baymore-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_APP_URL
        sync: false
      - key: CINETPAY_APIKEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: UPLOADTHING_TOKEN
        sync: false
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_API_KEY
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
